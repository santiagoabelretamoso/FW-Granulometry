name: One-time About cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-about-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant developer card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(
              r'<div class="about-side reveal">.*?<div class="about-meta">.*?</div></div>',
              '',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('about-side block not found exactly once')

          s = s.replace(
              '<section class="section shell" id="about"><div class="about-grid"><article class="about-card reveal">',
              '<section class="section shell" id="about"><article class="about-card reveal">',
              1,
          )
          s = s.replace(
              '</div></article></div></section>\n<section class="section shell" id="ras2025">',
              '</div></article></section>\n<section class="section shell" id="ras2025">',
              1,
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remove redundant developer card"
          git push
